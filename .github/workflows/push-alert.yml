name: push-alert
# Relays the fetcher's alert file to ntfy whenever a scheduled local run
# pushes changed data (runs only when data/alert.txt itself changed).
# alert.txt is markdown — rendered by the ntfy app (X-Markdown), with the
# first listing URL set as the notification's tap target.
on:
  push:
    branches: [main]
    paths: [data/alert.txt]
  workflow_dispatch:

jobs:
  ntfy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send ntfy alert
        if: env.NTFY_TOPIC != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -s data/alert.txt ]; then
            CLICK=$(grep -o 'https://[^) ]*' data/alert.txt | head -1)
            ARGS=(-H "Title: Car watch update" -H "Tags: car" -H "X-Markdown: true")
            [ -n "$CLICK" ] && ARGS+=(-H "Click: $CLICK")
            curl -sf -T data/alert.txt "${ARGS[@]}" "https://ntfy.sh/${NTFY_TOPIC}"
          fi