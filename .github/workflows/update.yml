name: update-listings
# Manual/backup only: AutoTrader 503-blocks GitHub-hosted runners, so the
# regular schedule is a local Windows Task Scheduler job (run-local.ps1) that
# commits data; push-alert.yml relays alerts to ntfy on push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch listings
        run: node fetch-listings.mjs

      - name: LLM analyst (optional — runs only if ANALYZE_API_KEY secret is set)
        env:
          ANALYZE_API_KEY: ${{ secrets.ANALYZE_API_KEY }}
          ANALYZE_MODEL: ${{ vars.ANALYZE_MODEL }}
        run: node analyze.mjs

      - name: Commit data
        run: |
          git config user.name "duster-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update listings $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      # alert delivery lives in push-alert.yml (triggered on data/alert.txt changes)