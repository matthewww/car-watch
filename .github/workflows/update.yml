name: update-listings
on:
  schedule:
    - cron: "20 1,7,13,19 * * *"   # 4x daily, offset from the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch listings
        run: node fetch-listings.mjs

      - name: Commit data
        run: |
          git config user.name "duster-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update listings $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Push alert
        if: env.NTFY_TOPIC != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -s data/alert.txt ]; then
            curl -sf -T data/alert.txt \
              -H "Title: Duster watch update" -H "Tags: car" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi