<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Watch — KZN</title>
<style>
  :root { --ink:#1a1d21; --mut:#6b7280; --line:#e5e7eb; --bg:#f6f7f8; --card:#fff;
          --new:#2563eb; --drop:#059669; --up:#b45309; --gone:#9ca3af; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:9; background:var(--card); border-bottom:1px solid var(--line);
           padding:10px 14px 8px; }
  h1 { font-size:17px; margin:0; display:flex; justify-content:space-between; align-items:baseline; }
  h1 small { font-weight:400; color:var(--mut); font-size:12px; }
  #banner { display:none; margin-top:6px; font-size:13px; padding:6px 10px; border-radius:8px;
            background:#eff6ff; color:var(--new); }
  .controls { padding:8px 14px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chips { display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px;
          padding:5px 12px; font-size:13px; white-space:nowrap; cursor:pointer; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  select { border:1px solid var(--line); border-radius:8px; padding:5px 6px; font-size:13px; background:var(--card); }
  main { padding:0 14px 40px; }
  details.group { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:10px 0; }
  details.group > summary { padding:10px 14px; font-weight:600; font-size:14px; cursor:pointer;
                            list-style:none; display:flex; justify-content:space-between; }
  details.group > summary::-webkit-details-marker { display:none; }
  details.group > summary::after { content:"▾"; color:var(--mut); }
  details.group[open] > summary::after { content:"▴"; }
  .card { display:block; border-top:1px solid var(--line); padding:10px 14px; text-decoration:none; color:inherit; }
  .row1 { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .price { font-weight:700; font-size:17px; white-space:nowrap; }
  .title { font-size:14px; }
  .spec { color:var(--mut); font-size:12.5px; margin-top:2px; }
  .deal { font-size:12.5px; margin-top:3px; }
  .b { display:inline-block; font-size:11px; font-weight:600; border-radius:5px; padding:1px 6px;
       margin-right:4px; vertical-align:1px; }
  .b.flag-great { background:#dcfce7; color:#15803d; }
  .b.flag-fair  { background:#fef9c3; color:#a16207; }
  .b.flag-high  { background:#fee2e2; color:#b91c1c; }
  .b.under { background:#dcfce7; color:#15803d; }
  .b.over  { background:#ffedd5; color:#c2410c; }
  .b.new  { background:var(--new); color:#fff; }
  .b.drop { background:var(--drop); color:#fff; }
  .b.up   { background:#fef3c7; color:var(--up); }
  .gone { opacity:.45; }
  .gone .price { text-decoration:line-through; }
  .spark { flex-shrink:0; opacity:.9; }
  .cchip { display:inline-block; margin-left:6px; padding:0 6px; border-radius:999px;
           font-size:10.5px; line-height:15px; vertical-align:1px; white-space:nowrap;
           border:1px solid rgba(0,0,0,.12); }
  footer { text-align:center; color:var(--mut); font-size:12px; padding:12px; }
  .empty { color:var(--mut); font-size:13px; padding:20px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Car Watch <small id="updated"></small></h1>
  <div id="banner"></div>
  <div id="stats" class="spec" style="padding:2px 0 0;font-size:12.5px;color:var(--mut)"></div>
</header>
<div class="controls">
  <div class="chips" id="tabs"></div>
</div>
<div class="controls">
  <div class="chips" id="chips">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="auto">Auto only</button>
    <button class="chip" data-f="2020">2020+</button>
    <button class="chip" data-f="deal">Auto + 2020+</button>
  </div>
  <select id="sort">
    <option value="price">Price ↑</option>
    <option value="price-desc">Price ↓</option>
    <option value="value">Value ↑</option>
    <option value="km">km ↑</option>
    <option value="year">Year ↓</option>
  </select>
</div>
<div class="controls" id="arearow">
  <div class="chips" id="areachips"></div>
</div>
<div id="notes"></div>
<main id="out"><div class="empty">Loading…</div></main>
<footer>AutoTrader KZN — <a id="searchlink" href="#">open current search</a></footer>

<script>
const GROUP_ORDER = ["Durban", "Hillcrest & Pinetown", "Pietermaritzburg", "North Coast & Outer", "Other"];
const GROUP_SHORT = { "Hillcrest & Pinetown": "Hillcrest/Pinetown", "North Coast & Outer": "N-Coast/Outer" };
const fmt = (n) => n == null ? "?" : "R" + n.toLocaleString("en-ZA");
const days = (iso) => (Date.now() - Date.parse(iso)) / 864e5;
let filter = "all", area = "all", sort = "price", data = null, cur = null, disc = false, discovery = null, analystData = null;

const FILTERS = {
  all: (l) => !l.removedAt,
  auto: (l) => !l.removedAt && l.transmission === "Automatic",
  "2020": (l) => !l.removedAt && (l.year ?? 0) >= 2020,
  deal: (l) => !l.removedAt && l.transmission === "Automatic" && (l.year ?? 0) >= 2020,
};

function badges(l) {
  let b = l.src
    ? `<span class="b" style="background:#e0e7ff;color:#3730a3">${l.src}</span>`
    : "";
  if (l.estUnder != null && Math.abs(l.estUnder) >= 3000)
    b += l.estUnder > 0
      ? `<span class="b under" title="vs price model fitted on current inventory">≈${Math.round(l.estUnder / 1000)}k under</span>`
      : `<span class="b over" title="vs price model fitted on current inventory">≈${Math.round(-l.estUnder / 1000)}k over</span>`;
  if (l.priceFlag) b += `<span class="b flag-${l.priceFlag.split(" ")[0].toLowerCase()}">${l.priceFlag}</span>`;
  const fresh = l.firstSeen && days(l.firstSeen) < 3;
  if (fresh && !l.removedAt) b += `<span class="b new">NEW</span>`;
  const last = l.priceHistory?.[l.priceHistory.length - 1];
  if (last && last.to < last.from && days(last.date) < 7)
    b += `<span class="b drop">↓${fmt(last.from - last.to)}</span>`;
  if (last && last.to > last.from && days(last.date) < 7)
    b += `<span class="b up">↑</span>`;
  if (l.removedAt) b += `<span class="b" style="background:var(--gone);color:#fff">GONE</span>`;
  return b;
}

const COLOUR_HEX = {
  white: "#f1f5f9", ivory: "#fdfbf4", pearl: "#eef2f7", cream: "#f5eeda",
  silver: "#c9cdd4", grey: "#9ca3af", gray: "#9ca3af", gunmetal: "#4b5563",
  graphite: "#414b57", charcoal: "#2f3540", black: "#111827",
  red: "#dc2626", burgundy: "#6b1220", maroon: "#6b1220",
  orange: "#ea580c", copper: "#b45309", bronze: "#8a5a2b", gold: "#c9a227", champagne: "#e3d3a8",
  beige: "#e2d5b4", tan: "#cbaa6d", brown: "#6b4423",
  yellow: "#eab308", green: "#15803d", olive: "#4d7c0f", lime: "#65a30d",
  blue: "#2563eb", navy: "#1e3a8a", sky: "#38bdf8", turquoise: "#0d9488", teal: "#0d9488",
  purple: "#6d28d9",
};
const DARK_HEX = new Set(["#111827", "#2f3540", "#414b57", "#4b5563", "#6b1220", "#6b4423",
  "#8a5a2b", "#15803d", "#4d7c0f", "#1e3a8a", "#0d9488", "#6d28d9", "#b45309"]);

function colourChip(l) {
  const name = (l.colour ?? "").replace(/[^A-Za-z ]/g, "").trim();
  if (!name) return "";
  const key = Object.keys(COLOUR_HEX).find((k) => name.toLowerCase().includes(k));
  const bg = key ? COLOUR_HEX[key] : "#e5e7eb";
  const fg = DARK_HEX.has(bg) ? "#fff" : "#111827";
  return `<span class="cchip" title="Colour: ${name}" style="background:${bg};color:${fg}">${name}</span>`;
}

/** Mini price graph from priceHistory (+ current price); hidden until there
 * are at least two points. */
function spark(l) {
  const hist = l.priceHistory ?? [];
  if (!hist.length || l.price == null) return "";
  const series = [hist[0].from, ...hist.map((h) => h.to)];
  if (series[series.length - 1] !== l.price) series.push(l.price);
  if (series.length < 2) return "";
  const lo = Math.min(...series), hi = Math.max(...series);
  const W = 56, H = 15, pad = 2.5;
  const xy = series.map((p, i) => {
    const x = pad + (i / (series.length - 1)) * (W - 2 * pad);
    const y = hi === lo ? H / 2 : pad + (1 - (p - lo) / (hi - lo)) * (H - 2 * pad);
    return [x, y];
  });
  const stroke = series[series.length - 1] > series[0] ? "var(--up)"
    : series[series.length - 1] < series[0] ? "var(--drop)" : "var(--mut)";
  const pts = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const [lx, ly] = xy[xy.length - 1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2" fill="${stroke}"/></svg>`;
}

function card(l) {
  const hist = (l.priceHistory ?? []).map((h) => `${h.date.slice(0, 10)}: ${fmt(h.from)} → ${fmt(h.to)}`).join("\n");
  const spec = [l.condition, l.km != null ? l.km.toLocaleString("en-ZA") + " km" : null,
                l.transmission, l.fuel].filter(Boolean).join(" · ");
  const deal = [l.dealer, l.area].filter(Boolean).join(" — ")
    + (l.dealerRating != null ? ` · ⭐${l.dealerRating} (${l.dealerReviews})` : "");
  return `<a class="card${l.removedAt ? " gone" : ""}" href="${l.url}" target="_blank" rel="noopener">
    <div class="row1"><span class="title">${l.year ?? "?"} ${l.variant ?? l.trim ?? "?"}</span>
      <span style="display:flex;align-items:center;gap:6px"><span class="price">${fmt(l.price)}</span>${spark(l)}</span></div>
    <div class="spec">${spec}${colourChip(l)}${l.incomplete ? " · <em>details not rendered by source</em>" : ""}</div>
    <div class="deal">${deal}</div>
    <div style="margin-top:4px">${badges(l)}</div></a>`;
}

/** Virtual search for the "All" tab: every live listing across all searches,
 * each tagged with its source search label. */
function getSearch() {
  if (cur === "__all") {
    const listings = Object.entries(data.searches)
      .flatMap(([k, s]) => s.listings.map((l) => ({ ...l, src: s.label })));
    return { label: "All models", url: null, listings };
  }
  return data.searches[cur];
}

function render() {
  const s = getSearch();
  if (!s) return;
  document.getElementById("arearow").style.display = "";
  const live = s.listings.filter(FILTERS[filter])
    .filter((l) => area === "all" || (l.group ?? "Other") === area);
  const cmp = {
    price: (a, b) => (a.price ?? 9e9) - (b.price ?? 9e9),
    "price-desc": (a, b) => (b.price ?? 0) - (a.price ?? 0),
    value: (a, b) => (b.estUnder ?? -9e9) - (a.estUnder ?? -9e9),
    km: (a, b) => (a.km ?? 9e9) - (b.km ?? 9e9),
    year: (a, b) => (b.year ?? 0) - (a.year ?? 0),
  }[sort];
  // landscape stats for this search
  const priced = s.listings.filter((l) => !l.removedAt && l.price).map((l) => l.price).sort((a, b) => a - b);
  document.getElementById("stats").textContent = priced.length
    ? `${s.label} market: ${priced.length} live · R${Math.min(...priced).toLocaleString("en-ZA")} – R${Math.max(...priced).toLocaleString("en-ZA")} · median R${priced[Math.floor(priced.length / 2)].toLocaleString("en-ZA")}`
    : `${s.label}: no priced listings`;
  const linkEl = document.getElementById("searchlink");
  if (s.url) { linkEl.style.display = ""; linkEl.href = s.url; }
  else linkEl.style.display = "none";
  const groups = GROUP_ORDER.map((g) => ({ name: g, items: live.filter((l) => (l.group ?? "Other") === g).sort(cmp) }));
  if (live.length && groups.every((g) => !g.items.length))
    groups.push({ name: "Unmatched area", items: live.filter((l) => !GROUP_ORDER.includes(l.group)).sort(cmp) });
  const removedRecent = s.listings
    .filter((l) => l.removedAt && days(l.removedAt) < 7)
    .sort(cmp);
  document.getElementById("out").innerHTML = groups
    .filter((g) => g.items.length)
    .map((g) => {
      const prices = g.items.filter((l) => l.price).map((l) => l.price);
      const range = prices.length ? `R${Math.min(...prices).toLocaleString("en-ZA")}–${Math.max(...prices).toLocaleString("en-ZA")}` : "";
      const label = GROUP_SHORT[g.name] ?? g.name;
      return `<details class="group" open><summary><span>${label} <small style="font-weight:400;color:var(--mut)">(${g.items.length})</small></span><small style="font-weight:400;color:var(--mut)">${range}</small></summary>
        ${g.items.map(card).join("")}</details>`;
    })
    .join("")
    + (filter === "all" && removedRecent.length
      ? `<details class="group"><summary><span>Recently removed <small style="font-weight:400;color:var(--mut)">(${removedRecent.length})</small></span></summary>${removedRecent.map(card).join("")}</details>`
      : "")
    || `<div class="empty">Nothing matches this filter right now.</div>`;
}

function renderTabs() {
  document.getElementById("tabs").innerHTML =
    `<button class="chip${!disc && cur === "__all" ? " on" : ""}" data-k="__all">All</button>`
    + Object.entries(data.searches)
      .map(([k, v]) => `<button class="chip${!disc && k === cur ? " on" : ""}" data-k="${k}">${v.label}</button>`)
      .join("")
    + `<button class="chip${disc ? " on" : ""}" data-k="__discover">Discover</button>`;
}

function renderAnalyst(a) {
  analystData = a;
  if (disc) return;
  const s = data.searches[cur];
  const block = a?.searches?.[cur];
  if (!block?.headline || !s) { document.getElementById("notes").replaceChildren(); return; }
  const byId = new Map(s.listings.map((l) => [String(l.id), l]));
  const el = document.createElement("details");
  el.className = "group";
  el.open = true;
  el.innerHTML = `<summary><span>${s.label} notes <small style="font-weight:400;color:var(--mut)">· ${a.model ?? ""} · ${new Date(a.generatedAt).toLocaleString("en-ZA", { dateStyle: "short", timeStyle: "short" })}</small></span></summary>
    <div class="card" style="cursor:default"><div class="spec" style="font-size:13px">${block.headline}</div></div>`
    + (block.shortlist ?? []).map((p) => {
        const l = byId.get(String(p.id));
        if (!l) return "";
        return `<a class="card" href="${l.url}" target="_blank" rel="noopener">
          <div class="row1"><span class="title">${l.year ?? "?"} ${l.variant ?? l.trim}</span><span class="price">${fmt(l.price)}</span></div>
          <div class="spec">${p.note}</div></a>`;
      }).join("");
  document.getElementById("notes").replaceChildren(el);
}

function bootNum(t) {
  const m = String(t ?? "").match(/\d{3}/);
  return m ? parseInt(m[0], 10) : 0;
}

function renderDiscovery() {
  const outEl = document.getElementById("out");
  document.getElementById("searchlink").style.display = "none";
  document.getElementById("arearow").style.display = "none";
  const cands = (discovery?.candidates ?? []).map((c) => ({ ...c, bootNum: bootNum(c.boot) }));
  const good = cands.filter((c) => c.bootNum >= 400).sort((a, b) => b.bootNum - a.bootNum || b.autos - a.autos);
  const ruled = cands.filter((c) => c.bootNum < 400).sort((a, b) => b.autos - a.autos);
  document.getElementById("stats").textContent = discovery
    ? `Discovery sweep ${new Date(discovery.generatedAt).toLocaleDateString("en-ZA")} — ${cands.length} unwatched models · ${good.length} boot-qualified/borderline`
    : "Discovery: no sweep yet — runs weekly via CarWatch";
  if (!cands.length) {
    outEl.innerHTML = `<div class="empty">${discovery ? "No candidates this sweep." : "No discovery data yet."}</div>`;
    document.getElementById("notes").replaceChildren();
    return;
  }
  const picks = new Map((analystData?.discovery?.shortlist ?? []).map((p) => [String(p.id), p.note]));
  const head = analystData?.discovery?.headline;
  const card = (c) => {
    const note = picks.get(c.key);
    const range = c.max > c.min ? `R${c.min.toLocaleString("en-ZA")}–R${c.max.toLocaleString("en-ZA")}` : `R${c.min.toLocaleString("en-ZA")}`;
    return `<a class="card" href="${c.sample}" target="_blank" rel="noopener">
      <div class="row1"><span class="title">${c.make} ${c.model}</span><span class="price">${range}</span></div>
      <div class="spec">${c.count} in-cap listing${c.count == 1 ? "" : "s"} · ${c.autos} automatic · boot ${c.boot ?? "?"}</div>
      ${note ? `<div class="deal">${note}</div>` : ""}</a>`;
  };
  outEl.innerHTML =
    (head ? `<div class="group" style="padding:10px 14px"><div class="spec" style="font-size:13px">${head}</div></div>` : "")
    + (good.length ? `<details class="group" open><summary><span>Boot-qualified / borderline <small style="font-weight:400;color:var(--mut)">(≥400 L, ${good.length})</small></span></summary>${good.map(card).join("")}</details>` : "")
    + (ruled.length ? `<details class="group"><summary><span>Ruled out on boot <small style="font-weight:400;color:var(--mut)">(&lt;400 L or unknown, ${ruled.length})</small></span></summary>${ruled.map(card).join("")}</details>` : "")
    || `<div class="empty">No candidates.</div>`;
  document.getElementById("notes").replaceChildren();
}

function renderAreaChips() {
  document.getElementById("areachips").innerHTML =
    [{ v: "all", t: "All areas" }]
      .concat(GROUP_ORDER.map((g) => ({ v: g, t: GROUP_SHORT[g] ?? g })))
      .map((o) => `<button class="chip${area === o.v ? " on" : ""}" data-a="${o.v}">${o.t}</button>`)
      .join("");
}

fetch("data/listings.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((d) => {
    data = d;
    const keys = Object.keys(data.searches);
    const saved = localStorage.getItem("cw-tab");
    if (saved === "__discover") { disc = true; cur = keys[0]; }
    else cur = keys.includes(saved) ? saved : keys[0];
    renderTabs();
    document.getElementById("updated").textContent =
      "updated " + new Date(d.generatedAt).toLocaleString("en-ZA", { dateStyle: "medium", timeStyle: "short" });
    const last = localStorage.getItem("cw-last-visit");
    if (last) {
      const allListings = Object.values(data.searches).flatMap((s) => s.listings);
      const fresh = allListings.filter((l) => !l.removedAt && Date.parse(l.firstSeen) > Date.parse(last));
      const drops = allListings.filter((l) => (l.priceHistory ?? []).some(
        (h) => h.to < h.from && Date.parse(h.date) > Date.parse(last)));
      if (fresh.length || drops.length) {
        const el = document.getElementById("banner");
        el.style.display = "block";
        el.textContent = `Since your last visit: ${fresh.length} new · ${drops.length} price drop${drops.length == 1 ? "" : "s"}`;
      }
    }
    localStorage.setItem("cw-last-visit", String(Date.now()));
    if (disc) renderDiscovery(); else render();
    // optional LLM analyst notes (data/analysis.json only exists when configured)
    fetch("data/analysis.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then(renderAnalyst)
      .catch(() => {});
    // optional discovery sweep (data/discovery.json only exists after discover.mjs)
    fetch("data/discovery.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { discovery = d; if (disc) renderDiscovery(); })
      .catch(() => {});
  })
  .catch(() => { document.getElementById("out").innerHTML = '<div class="empty">Could not load data/listings.json — run <code>node fetch-listings.mjs</code> first.</div>'; });

document.getElementById("tabs").addEventListener("click", (e) => {
  const k = e.target.dataset.k;
  if (!k) return;
  if (k === "__discover") { if (disc) return; disc = true; }
  else { if (!disc && k === cur) return; disc = false; cur = k; }
  localStorage.setItem("cw-tab", disc ? "__discover" : cur);
  renderTabs();
  if (disc) { renderDiscovery(); return; }
  document.getElementById("searchlink").style.display = "";
  render();
  fetch("data/analysis.json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then(renderAnalyst)
    .catch(() => {});
});

document.getElementById("chips").addEventListener("click", (e) => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  for (const c of document.querySelectorAll(".chip")) c.classList.toggle("on", c === e.target);
  render();
});
document.getElementById("areachips").addEventListener("click", (e) => {
  const a = e.target.dataset.a;
  if (!a) return;
  area = a;
  renderAreaChips();
  render();
});
document.getElementById("sort").addEventListener("change", (e) => { sort = e.target.value; render(); });
</script>
</body>
</html>
